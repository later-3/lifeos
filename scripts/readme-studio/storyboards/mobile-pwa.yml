# mobile-pwa：手机竖屏两屏路径（DIRECTOR.md 类型：操作演示）。
# 首页（同事 → 项目导航）→ 选中项目 → 会话列表 → 进会话。
#
# 手机导航是**全屏覆盖层**（`[data-testid="mobile-nav"]`），`data-mobile-level` 逐层下钻；
# 每一步都要在覆盖层内取元素，否则点到被遮住的背景（Playwright 报 intercepts pointer events）。
name: mobile-pwa
mode: video
viewport: { width: 390, height: 844 }
size: { width: 390, height: 844 }
path: /
outputs:
  - { type: gif, file: mobile-pwa.gif, fps: 10, width: 780, colors: 192 }
steps:
  - waitFor: '[aria-label="返回项目"]'
  - pause: 1.2
  - click: '[aria-label="返回项目"]'
  - pause: 1.3
  - move: { x: 195, y: 260, steps: 8 }
  - pause: 0.5
  - click: '[data-testid="mobile-nav"] >> text=workspace'
  - pause: 1.4
  - move: { x: 195, y: 330, steps: 8 }
  - pause: 0.5
  - click: '[data-testid="mobile-nav"] >> text=最近成都的天气'
  - pause: 2.0
  - move: { x: 195, y: 560, steps: 12 }
  - pause: 1.4
