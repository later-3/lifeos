# mobile-pwa：手机竖屏的两屏路径（导航 → 会话）。
#
# 手机导航是**全屏覆盖层**（`[data-testid="mobile-nav"]`），`data-mobile-level` 逐层下钻：
#   projects（项目）→ sessions（会话）→ 关闭覆盖层回到对话
# 每一步都必须在覆盖层内取元素，否则会点到被遮住的背景（Playwright 报 intercepts pointer events）。
name: mobile-pwa
mode: video
viewport: { width: 390, height: 844 }
size: { width: 390, height: 844 }
path: /
outputs:
  - { type: gif, file: mobile-pwa.gif, fps: 10, width: 780, colors: 192 }
steps:
  - waitFor: '[aria-label="返回项目"]'
  - pause: 1.3
  - click: '[aria-label="返回项目"]'
  - pause: 1.4
  - move: { x: 195, y: 240, steps: 8 }
  - pause: 0.6
  - click: '[data-testid="mobile-nav"] >> text=lifelab'
  - pause: 1.5
  - move: { x: 195, y: 320, steps: 8 }
  - pause: 0.6
  - click: '[data-testid="mobile-nav"] >> text=0002 的设计'
  - pause: 2.2
  - move: { x: 195, y: 560, steps: 12 }
  - pause: 1.6
