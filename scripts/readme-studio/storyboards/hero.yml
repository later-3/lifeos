# hero：README 首屏总览动图（DIRECTOR.md 类型：操作演示）。
#
# 演：打开一条真实会话 → 显示出「一轮到底干了什么」→ 打字提问 → 状态条推进 → 正文流出。
# 用 showcase 家目录（真实数据的副本）：14 个 Agent、真头像、有内容的会话。
name: hero
mode: video
viewport: { width: 1000, height: 625 }
size: { width: 1000, height: 625 }
path: /
outputs:
  - { type: gif, file: hero.gif, fps: 10, width: 1000, colors: 128 }
trimEnd: 0
steps:
  - waitFor: '[data-testid="groups-panel"]'
  - pause: 1.0
  - click: 'text=Architect'
  - pause: 0.8
  - click: 'text=我在想一个问题，Obsidian Codex Z-Code'
  - pause: 1.6
  - move: { x: 700, y: 300, steps: 10 }
  - pause: 0.8
  - click: '[data-testid="composer"]'
  - pause: 0.2
  - type: { into: '[data-testid="composer"]', text: "退款金额要从 refunds[] 算，别读状态", delayMs: 30 }
  - press: Enter
  - pause: 1.2
  - waitFor: '[data-testid="response-bar"]'
  - pause: 3.2
  - move: { x: 660, y: 200, steps: 10 }
  - pause: 1.4
