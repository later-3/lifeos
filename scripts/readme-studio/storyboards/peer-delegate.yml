# peer-delegate：Agent 之间的对话。
#
# **诚实边界**：打桩模型不会真的触发 `lifeos_ask` 工具链，所以拍不出"派活 → 回流"的完整过程。
# 这条素材拍的是**真实存在的东西**：coder 与 Life Agent 之间的那条会话，
# 包括会话行上的叠放头像、头部对端信息、以及消息里的双头像。
# 文案里不写"派活"，只写"Agent 之间也有对话"——不假装拍到了没有的东西。
name: peer-delegate
mode: video
viewport: { width: 1000, height: 625 }
size: { width: 1000, height: 625 }
path: /
outputs:
  - { type: gif, file: peer-delegate.gif, fps: 10, width: 1000, colors: 128 }
steps:
  - waitFor: '[data-testid="groups-panel"]'
  - pause: 1.0
  - click: 'text=coder'
  - pause: 1.2
  - move: { x: 400, y: 200, steps: 10 }
  - pause: 0.8
  - click: 'text=与 Life Agent 的对话'
  - pause: 2.0
  - move: { x: 700, y: 300, steps: 12 }
  - pause: 1.4
  - move: { x: 640, y: 120, steps: 8 }
  - pause: 1.0
