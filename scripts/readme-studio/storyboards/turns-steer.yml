# turns-steer：生成中插话（DIRECTOR.md 类型：操作演示）。
# 演：一轮正在跑 → 输入框打字 → Enter 插话 → 状态条显示「已插话」→ 回复继续。
name: turns-steer
mode: video
viewport: { width: 1000, height: 625 }
size: { width: 1000, height: 625 }
path: /
outputs:
  - { type: gif, file: turns-steer.gif, fps: 8, width: 1000, colors: 96 }
steps:
  - waitFor: '[data-testid="groups-panel"]'
  - pause: 0.8
  - click: 'text=Architect'
  - pause: 0.7
  - click: 'text=我在想一个问题，Obsidian Codex Z-Code'
  - pause: 1.2
  - click: '[data-testid="composer"]'
  - pause: 0.2
  - type: { into: '[data-testid="composer"]', text: "另外把迁移步骤也写上", delayMs: 26 }
  - press: Enter
  - pause: 1.0
  - waitFor: '[data-testid="response-bar"]'
  - pause: 1.2
  - move: { x: 700, y: 150, steps: 8 }
  - pause: 0.5
  - click: '[data-testid="composer"]'
  - pause: 0.2
  - type: { into: '[data-testid="composer"]', text: "退款金额记得从 refunds[] 算", delayMs: 22 }
  - pause: 0.4
  - press: Enter
  - pause: 2.2
  - move: { x: 620, y: 520, steps: 10 }
  - pause: 1.2
