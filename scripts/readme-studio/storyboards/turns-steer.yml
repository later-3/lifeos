# turns-steer：生成中插话（steer）。
# 演示：一轮正在跑 → 输入框打字 → Enter 插话 → 状态条出现插话反馈 → 回复继续。
name: turns-steer
mode: video
viewport: { width: 1000, height: 625 }
size: { width: 1000, height: 625 }
path: /
outputs:
  - { type: gif, file: turns-steer.gif, fps: 10, width: 1000, colors: 128 }
steps:
  - waitFor: '[data-testid="groups-panel"]'
  - pause: 1.0
  - click: 'text=Architect'
  - pause: 0.8
  - click: '[aria-label="在 lifelab 新建会话"]'
  - pause: 0.8
  - click: '[data-testid="composer"]'
  - pause: 0.2
  - type: { into: '[data-testid="composer"]', text: "支付状态机有 11 个态，能收敛成 4 个吗？", delayMs: 30 }
  - press: Enter
  - pause: 1.4
  - waitFor: '[data-testid="response-bar"]'
  - move: { x: 700, y: 120, steps: 10 }
  - pause: 0.6
  - click: '[data-testid="composer"]'
  - pause: 0.3
  - type: { into: '[data-testid="composer"]', text: "顺便说一下，退款金额要看 refunds[]", delayMs: 26 }
  - pause: 0.4
  - press: Enter
  - pause: 2.4
  - move: { x: 620, y: 96, steps: 10 }
  - pause: 1.2
