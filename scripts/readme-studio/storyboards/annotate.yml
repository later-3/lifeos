# annotate：批注（DIRECTOR.md 类型：操作演示）。
# 演：拖选一段正文 → 功能条 → 批注 → 选语气「疑问」→ 写一句 → 标上 → 高亮留在原文。
name: annotate
mode: video
viewport: { width: 1000, height: 625 }
size: { width: 1000, height: 625 }
path: /
outputs:
  - { type: gif, file: annotate.gif, fps: 10, width: 1000, colors: 128 }
steps:
  - waitFor: '[data-testid="groups-panel"]'
  - pause: 0.7
  - click: 'text=Architect'
  - pause: 0.6
  - click: 'text=我在想一个问题，Obsidian Codex Z-Code'
  - pause: 1.4
  - selectText: { selector: '[data-testid="message-text"]', chars: 20 }
  - pause: 0.9
  - click: 'button:has-text("批注")'
  - pause: 0.9
  - click: 'button:has-text("疑问")'
  - pause: 0.6
  - click: 'textarea'
  - pause: 0.2
  - type: { into: 'textarea', text: "这里的 37 处是全仓还是只 payment？", delayMs: 18 }
  - pause: 0.5
  - click: 'button:has-text("标上")'
  - pause: 1.4
  - move: { x: 700, y: 300, steps: 10 }
  - pause: 1.2
