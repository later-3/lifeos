# review：检视模式（DIRECTOR.md 类型：操作演示 + 细节强调）。
# 演：打开检视 → 两组源（项目代码 / Task 文档）→ 展开文档 diff → 绿色新增行可评论。
#
# 数据来源：showcase 家目录里 architect/lifeos/0002 的 04-contract.md 有一处未提交改动
# （由 scripts/readme-studio/showcase-changes.mjs 每次重造，保证可复现）。
name: review
mode: video
viewport: { width: 1000, height: 625 }
size: { width: 1000, height: 625 }
path: /
outputs:
  - { type: gif, file: review.gif, fps: 8, width: 1000, colors: 96 }
steps:
  - waitFor: '[data-testid="groups-panel"]'
  - pause: 0.9
  - click: 'text=Architect'
  - pause: 0.8
  - click: 'text=我在想一个问题，Obsidian Codex Z-Code'
  - pause: 1.4
  - click: '[aria-label="检视当前 Task 的改动"]'
  - pause: 2.2
  - move: { x: 640, y: 300, steps: 10 }
  - pause: 0.7
  - click: '[data-review-file]'
  - pause: 1.8
  - move: { x: 700, y: 430, steps: 12 }
  - pause: 1.4
