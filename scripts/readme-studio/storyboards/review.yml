# review：检视模式。打开检视面板 → 两组源 → 展开文档 diff → 拖选一段行区间 → 写评论。
#
# 前置：演示家目录必须是 git 仓且有一个「基线之后改动过」的 Task 文档
# （scripts/readme-demo-home.mjs 已负责造这个改动；没有它检视面板只会显示"没有可检视的改动"）。
name: review
mode: video
viewport: { width: 1000, height: 625 }
size: { width: 1000, height: 625 }
path: /
outputs:
  - { type: gif, file: review.gif, fps: 10, width: 1000, colors: 128 }
steps:
  - waitFor: '[data-testid="groups-panel"]'
  - pause: 0.9
  - click: 'text=0002 的设计：状态机与回调'
  - pause: 1.0
  - click: '[aria-label="检视当前 Task 的改动"]'
  - pause: 2.0
  - move: { x: 640, y: 300, steps: 10 }
  - pause: 0.9
  - click: '[data-review-file]'
  - pause: 1.8
  - move: { x: 700, y: 430, steps: 14 }
  - pause: 1.2
