      - pause: 1.4
      - click: 'text=草稿契约'
      - pause: 1.6

  - name: Gruvbox
    badge: "Gruvbox · Obsidian"
    trimEnd: 1.5
    prelude: |
      localStorage.setItem("lifeos.themePackActive", "Gruvbox");
