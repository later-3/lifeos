      - pause: 1.2
      - click: 'text=最近成都的天气'
      - pause: 1.4
      - click: 'text=草稿契约'
      - pause: 1.6


  - name: Minimal
    badge: "Minimal · Obsidian"
    trimEnd: 1.5
    prelude: |
      localStorage.setItem("lifeos.themePackActive", "Minimal");
    steps:
      - waitFor: '[data-testid="groups-panel"]'
      - pause: 1.2
      - click: 'text=最近成都的天气'
      - pause: 1.4
      - click: 'text=草稿契约'
      - pause: 1.6

  - name: Graphite Pie
