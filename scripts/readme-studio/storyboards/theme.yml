# theme：主题系统。设置 → 主题列表 → 切深浅 → 点主题卡片。
name: theme
mode: video
viewport: { width: 1000, height: 625 }
size: { width: 1000, height: 625 }
path: /
outputs:
  - { type: gif, file: theme-import.gif, fps: 10, width: 1000, colors: 128 }
steps:
  - waitFor: '[data-testid="groups-panel"]'
  - pause: 1.0
  - click: '[aria-label="设置"]'
  - pause: 1.4
  - move: { x: 700, y: 210, steps: 10 }
  - pause: 0.6
  - click: 'button:has-text("深色")'
  - pause: 2.2
  - move: { x: 700, y: 360, steps: 10 }
  - pause: 0.8
  - click: '[data-testid="settings-surface"] >> text=主题'
  - pause: 1.2
