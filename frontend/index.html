<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- 字体（S5）：系统字体栈无需网络加载；若主题选了自定义字体，由主题包注入 @font-face，
         这里预连接 Google Fonts（只在真用到时才会发请求，浏览器会跳过未使用的 preconnect）。 -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Life OS</title>
    <script>
      /*
       * 防闪（Task 0009 · L3，手法来自 LibreChat `theme/applyTheme.ts:20-27` 的 `data-theme-boot`）：
       * 首屏读取本地主题并立刻写到 :root，避免"先白后黑"的一跳。
       * 这里只做最小集（mode + 四档底色 + 主色），完整 token 由 design/theme.ts 在 React 起来后覆盖。
       * 读失败一律静默（隐私模式/无 localStorage），页面照常渲染默认主题。
       */
      (function () {
        try {
          var root = document.documentElement;
          var raw = localStorage.getItem("lifeos.theme");
          if (!raw) return;
          var t = JSON.parse(raw);
          var dark = t.mode === "dark";
          root.dataset.themeMode = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          root.setAttribute("data-theme-boot", "");

          /*
           * **首屏就要正确的四个颜色**（2026-11-09 实测：只写 data-theme-mode 时，
           * 深色用户刷新会先白 44–99ms —— React 起来才写 :root 的 token）。
           *
           * 只算四个（背景/页面底/导航列/正文），它们覆盖首屏可见面积；
           * 其余 token 等 React 起来后由 theme.ts 全量写入（同一套公式，见下方一致性测试）。
           *
           * 为什么要复制公式：这个脚本必须**同步**跑在首帧之前，不能 import 模块。
           * 漂移风险由 `test/boot-theme.test.mjs` 锁住（用同一 state 对比两边的结果）。
           */
          if (dark) {
            // 深色：轨 9.8 / 列 13.5 / 页面底 12.5 / 内容 16.4，正文墨色近白。
            // 这些值由 theme.ts 的 darkL() 对 lSurface=100 / lNav=96.9 / lRail=93 算出。
            root.style.setProperty("--color-surface", "#292828");
            root.style.setProperty("--color-sunken", "#212020");
            root.style.setProperty("--color-nav-bg", "#232222");
            root.style.setProperty("--color-nav-edge", "#1c1b1a");
            root.style.setProperty("--color-ink-900", "#faf1ef");
            root.style.setProperty("--color-line", "#363535");
            /* A4 收编族首帧（与引擎 dark 值同源，boot-theme.test 锁一致性）：
               语法高亮 / soft 底 / 消息块 / 表头——避免深色首帧闪浅色系。 */
            root.style.setProperty("--color-syn-keyword", "#c8c7ff");
            root.style.setProperty("--color-syn-string", "#acefa4");
            root.style.setProperty("--color-syn-comment", "#9ca4b0");
            root.style.setProperty("--color-syn-number", "#ffbc88");
            root.style.setProperty("--color-syn-function", "#94d2ff");
            root.style.setProperty("--color-syn-type", "#73eeee");
            root.style.setProperty("--color-syn-constant", "#f8b5ff");
            root.style.setProperty("--color-syn-punctuation", "#a2a6ac");
            root.style.setProperty("--color-danger-soft", "#332625");
            root.style.setProperty("--color-success-soft", "#222d26");
            root.style.setProperty("--color-running-soft", "#1c2f39");
            root.style.setProperty("--color-message-user", "#c96048");
            root.style.setProperty("--color-message-thinking", "#3b3432");
            root.style.setProperty("--color-message-tool", "#3b3432");
            root.style.setProperty("--color-message-tool-done", "#222d26");
            root.style.setProperty("--color-message-tool-error", "#332625");
            root.style.setProperty("--color-message-failure", "#332625");
            root.style.setProperty("--color-table-head", "#3b3432");
          } else {
            root.style.setProperty("--color-surface", "#ffffff");
            root.style.setProperty("--color-sunken", "#fbfafa");
            root.style.setProperty("--color-nav-bg", "#f7f6f5");
            root.style.setProperty("--color-nav-edge", "#ecebea");
            root.style.setProperty("--color-ink-900", "#312a29");
            root.style.setProperty("--color-line", "#e2e0e0");
          }
          root.style.backgroundColor = dark ? "#292828" : "#ffffff";
          /* 外部主题包首帧：如果用户激活了外部主题（VSCode/Obsidian 导入），
             用它的颜色覆盖内置默认——保证刷新时零色跳。 */
          try {
            var activePackName = localStorage.getItem("lifeos.themePackActive");
            if (activePackName) {
              var allPacks = JSON.parse(localStorage.getItem("lifeos.themePacks") || "[]");
              var activePack = allPacks.find(function(p) { return p.meta.name === activePackName; });
              if (activePack && activePack.modes) {
                var modeVars = activePack.modes[dark ? "dark" : "light"] || activePack.modes[dark ? "light" : "dark"] || {};
                for (var varName in modeVars) {
                  if (varName.startsWith("--color-") && typeof modeVars[varName] === "string" && modeVars[varName].charAt(0) === "#") {
                    root.style.setProperty(varName, modeVars[varName]);
                  }
                }
                // 背景色也用包的
                if (modeVars["--color-surface"] && modeVars["--color-surface"].charAt(0) === "#") {
                  root.style.backgroundColor = modeVars["--color-surface"];
                }
              }
            }
            // theme-color meta 同步（手机状态栏/浏览器标签色）
            var metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.content = root.style.backgroundColor;
          } catch(e) { /* 静默 */ }
        } catch (e) { /* 忽略 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
